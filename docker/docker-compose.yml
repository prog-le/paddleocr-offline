# =============================================================================
# PaddleX OCR Web · Docker Compose（离线单机部署）
#
# 使用方式（离线服务器）：
#   docker load -i paddlex-ocr-web-1.0.0-amd64.image.tar.gz
#   cd docker && cp .env.example .env && vi .env       # 设置镜像 tag / 端口 / 管理员密码
#   docker compose up -d
#
# 也可在本机直接构建并启动（需要网络拉取基础镜像）：
#   docker compose -f docker/docker-compose.yml up -d --build
# =============================================================================
name: paddlex-ocr

services:
  ocr-web:
    # 镜像名由 .env 控制；导入镜像时 import_and_start.sh 会自动写入正确的 tag
    image: ${IMAGE:-paddlex-ocr-web:1.0.0}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        TARGETARCH: ${TARGETARCH:-amd64}
        APP_VERSION: ${APP_VERSION:-1.0.0}
    container_name: ${CONTAINER_NAME:-paddlex-ocr-web}
    restart: unless-stopped
    # 作为 PID 1 收信号：没有它时 uvicorn 可能收不到 SIGTERM，docker stop 会等超时后 kill
    init: true
    stop_grace_period: 30s
    ports:
      - "${HOST_PORT:-8000}:8000"
    environment:
      # 留空则使用 config/config.yaml 中的值
      PADDLEX_OCR_ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      PADDLEX_OCR_CONCURRENCY: "${CONCURRENCY:-1}"
      PADDLEX_OCR_PDF_DPI: "${PDF_DPI:-200}"
      PADDLEX_OCR_LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      PADDLEX_OCR_RETENTION_HOURS: "${RETENTION_HOURS:-24}"
      PADDLEX_OCR_CONFIG: /app/config/config.yaml
      # 模型缓存固定在镜像内目录（离线，不会下载）
      PADDLE_PDX_CACHE_HOME: /app/models/paddlex_home
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
      TZ: "${TZ:-Asia/Shanghai}"
    volumes:
      - ${DATA_DIR:-../data}:/app/data
      - ${LOG_DIR:-../logs}:/app/logs
      # 如需替换模型，可挂载宿主目录覆盖（注意目录结构须为 official_models/<模型名>）
      # - ../models/paddlex_home:/app/models/paddlex_home:ro
    # CPU 推理的内存上限。**这是容器被 OOM kill（表现为“跑一会儿自己重启”）的头号原因**：
    #   单产线（OCR / 精简 / 表格）   建议 ≥ 6g
    #   同时用过两条产线（未卸载）     建议 ≥ 10g
    # 内存紧张时改用“降 pdf_dpi / max_side_px”而不是硬压这个值。
    mem_limit: ${MEM_LIMIT:-8g}
    shm_size: "256m"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    healthcheck:
      test: ["CMD", "python", "/app/scripts/docker_health.py"]
      interval: 30s
      # 推理时单进程会短时占满 CPU，健康检查偶尔会慢；给足超时避免误判 unhealthy
      timeout: 15s
      retries: 5
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
